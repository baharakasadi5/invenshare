name: invenshare

description: "InvenShare - Platform for inventors and ideas."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File & Storage
  path_provider: ^2.1.5

  # Image Picker (Camera & Gallery)
  image_picker: ^1.1.2

  # Generate unique IDs
  uuid: ^4.6.0

  # Read real app version
  package_info_plus: ^8.0.2

  # Backup / Restore file selection
  file_picker: ^8.1.6

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive generator
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:

  generate: true

  uses-material-design: true